<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
	th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">
<head>
<meta charset="UTF-8">
<title>勤怠情報変更｜LMS</title>
</head>
<body>

	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
	</th:block>

	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>勤怠管理 <small>( [[${attendanceForm.userName}]] )</small></h2>
		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2><small>途中退校日：${dispLeaveDate}</small></h2>
		</th:block>
	</th:block>
	
	<div class="row">
		<div class="bs-component col-sm-12">
			<form th:action="@{/attendance/update}" method="post">
				
<!-- 河島麻登花 - Task.29 --><!-- 一覧をスクロール表示できるように加筆 -->
				<table class="table table-hover dataTable no-footer">
					<thead class="db">
						<tr>
							<th class="w140">日付</th>
							<th class="w140">コース内容</th>
						<!-- 河島麻登花 - Task.28定時ボタン -->
							<th class="w60"></th>
						<!-- 河島麻登花 - Task.29 -->
      						<th class="w180" colspan="3">出勤</th>
      					<!-- 河島麻登花 - Task.29 -->
      						<th class="w180" colspan="3">退勤</th>
							<th class="w80">中抜け時間</th>
							<th class="w70">ステータス</th>
							<th class="w140">備考</th>
						</tr>
					</thead>
<!-- 河島麻登花 - Task.29 --><!-- 一覧をスクロール表示できるように加筆 -->
				<tbody class="db h560" style="overflow-y: scroll;">
						<th:block th:each="dailyAttendanceForm, stat : *{attendanceForm.attendanceList}">
							<tr>
								<th:block>
									<input type="hidden" th:name="|attendanceList[${stat.index}].isToday|" th:value="${dailyAttendanceForm.isToday}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].studentAttendanceId|" th:value="${dailyAttendanceForm.studentAttendanceId}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].trainingDate|" th:value="${dailyAttendanceForm.trainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].dispTrainingDate|" th:value="${dailyAttendanceForm.dispTrainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].sectionName|" th:value="${dailyAttendanceForm.sectionName}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].statusDispName|" th:value="${dailyAttendanceForm.statusDispName}" />
								</th:block>
								<td class="w140">[[${dailyAttendanceForm.dispTrainingDate}]]</td>
								<td class="w300">[[${dailyAttendanceForm.sectionName}]]</td>


<!-- 河島麻登花 - Task.28 「定時ボタン」の設置 -->
<td class="w60">
        <input type="button" value="定時" class="btn btn-success default-button"
          onclick="setDefaultTime(this)" />
</td>


<!-- 河島麻登花 - Task.26 出勤(時:分) -->
<td class="w70">
 		<select th:name="|attendanceList[${stat.index}].trainingStartTimeHour|"
			class="form-control w70">
 			<option value=""></option>
			<option th:each="h : ${attendanceForm.hourMap}"
                    th:value="${h.value}"
                    th:text="${h.value}"
                    th:selected="${h.value == dailyAttendanceForm.trainingStartTimeHour}"></option>
          </select>
		<!-- Task.27 出勤時間エラー表示 -->
  		<div th:errors="*{attendanceList[${stat.index}].trainingStartTimeHour}" class="text-danger"></div>
        </td>
        <td>:</td>
<td class="w70">
          <select th:name="|attendanceList[${stat.index}].trainingStartTimeMinute|"
          class="form-control w70">
            <option value=""></option>
            <option th:each="m : ${attendanceForm.minuteMap}"
                    th:value="${m.value}"
                    th:text="${m.value}"
                    th:selected="${m.value == dailyAttendanceForm.trainingStartTimeMinute}"></option>
          </select>
          <!-- 出勤時間（分）のエラー表示 -->
  <div th:errors="*{attendanceList[${stat.index}].trainingStartTimeMinute}" class="text-danger"></div>
        </td>

 <!-- 河島麻登花 - Task.26 退勤(時:分) -->
 <td class="w70">
          <select th:name="|attendanceList[${stat.index}].trainingEndTimeHour|"
          class="form-control w70">
            <option value=""></option>
            <option th:each="h : ${attendanceForm.hourMap}"
                    th:value="${h.value}"
                    th:text="${h.value}"
                    th:selected="${h.value == dailyAttendanceForm.trainingEndTimeHour}"></option>
          </select>
          <!-- 退勤時間エラー表示 -->
  <div th:errors="*{attendanceList[${stat.index}].trainingEndTimeHour}" class="text-danger"></div>

        </td>
        <td>:</td>
<td class="w70">
          <select th:name="|attendanceList[${stat.index}].trainingEndTimeMinute|"
          class="form-control w70">
            <option value=""></option>
            <option th:each="m : ${attendanceForm.minuteMap}"
                    th:value="${m.value}"
                    th:text="${m.value}"
                    th:selected="${m.value == dailyAttendanceForm.trainingEndTimeMinute}"></option>
          </select>
            <!-- 退勤時間（分）のエラー表示 -->
  <div th:errors="*{attendanceList[${stat.index}].trainingEndTimeMinute}" class="text-danger"></div>

        </td>

									<td class="w80">
									<!-- 中抜け時間 -->
									<select th:name="|attendanceList[${stat.index}].blankTime|" class="form-control w100">
										<option th:each="blankTime : ${attendanceForm.blankTimes}" th:value="${blankTime.key}" th:inline="text" class="form-control" 
											th:selected="${blankTime.key == dailyAttendanceForm.blankTime}">[[${blankTime.value}]]</option>
									</select>
									<!-- 中抜け時間エラー表示 -->
  <div th:errors="*{attendanceList[${stat.index}].blankTime}" class="text-danger"></div>

								</td>
								<!-- ステータスと備考 -->
								<td class="w70">[[${dailyAttendanceForm.statusDispName}]]</td>
								<td class="w240">
									<input type="text" th:name="|attendanceList[${stat.index}].note|" th:value="${dailyAttendanceForm.note}" class="form-control"></input>
						<!-- 備考エラー表示 -->
  <div th:errors="*{attendanceList[${stat.index}].note}" class="text-danger"></div>

						</td>
				</tr>
			</th:block>
		</tbody>
	</table>
		<div class="form-group">
					<th:block th:if="${session.loginUserDto.role == '0001'}">
						<a th:href="@{/attendance/detail}" class="btn btn-default">戻る</a>
					</th:block>
					
					<th:block th:if="${session.loginUserDto.role != '0001'}">
						<input type="submit" value="戻る" name="indexCompany" class="btn btn-default" />
					</th:block>
					
					<input type="submit" value="更新" name="complete" class="btn btn-info"
					 		onclick="return registCheck()"/>
					 </div>
				</form>
			</div>	 
		</div>
					 <!-- Task.27 JSで「更新確認ダイアログ」-->
					 <script>
						 function registCheck() {
							 return confirm("更新します。よろしいですか？");
							 }
					</script>
<!-- Task.28 定時ボタン-->
<script>
function setDefaultTime(button) {
    // 押されたボタンと同じ行を取得
    var row = button.closest("tr");

    // 出勤時刻 (09:00)
    var startHour = row.querySelector("select[name$='.trainingStartTimeHour']");
    var startMinute = row.querySelector("select[name$='.trainingStartTimeMinute']");
    if (startHour) startHour.value = "09";
    if (startMinute) startMinute.value = "00";

    // 退勤時刻 (18:00)
    var endHour = row.querySelector("select[name$='.trainingEndTimeHour']");
    var endMinute = row.querySelector("select[name$='.trainingEndTimeMinute']");
    if (endHour) endHour.value = "18";
    if (endMinute) endMinute.value = "00";
}
</script></body>
</html>
